name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  FORCE_COLOR: 3

# Nothing here writes to the repo, and the jobs run untrusted PR code in Docker.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run tests in Docker
        run: make docker-test

  minimal-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test setup without Homebrew
        run: make docker-test VARIANT=minimal

  # The Docker tests install into a clean container, so they never meet a
  # conflicting file at a link target. That branch is the one with prompts and
  # backups in it, and test-link.sh is what covers it — nothing was running it.
  link-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - run: make test-links

  # validate.sh deliberately no longer type checks the plugin ("CI's job"), and
  # the Docker tests only exercise the installer — so this is the only thing that
  # runs the hook's own tsc and test suite.
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
