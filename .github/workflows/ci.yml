name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  FORCE_COLOR: 3

# Nothing here writes to the repo, and the jobs run untrusted PR code in Docker.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run tests in Docker
        run: |
          make docker-test
          docker run --rm dotfiles make test-scripts

  minimal-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test setup without Homebrew
        run: make docker-test VARIANT=minimal

  macos-bootstrap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Uses controlled curl, Git and brew executables. It covers first-run
      # dispatch and PATH setup without installing packages on the runner.
      - run: make test-brew

  # The Docker tests only exercise the installer, so this is the only thing that
  # runs the hook's own test suite. The hook has no dependencies and nothing to
  # build, so there is no install step to run first.
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No path: node discovers **/*.test.mjs itself, so a second test file runs
      # here without anyone remembering to add it.
      - run: node --test
