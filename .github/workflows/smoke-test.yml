name: Smoke Test

# This installs from the deployed URL, so it has to run after Pages is updated.
# Chaining off the Repo Intel run that deploys it is what workflow_run is for —
# it replaces a step that polled the Actions API every 15s for up to 10 minutes.
on:
  workflow_run:
    workflows: [Repo Intel]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_COLOR: 3

permissions:
  contents: read

jobs:
  smoke-test:
    # workflow_run fires whatever the conclusion, so a failed or cancelled deploy
    # would otherwise smoke test the previous contents of the site.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The commit that was deployed, not whatever master points at now: two
      # pushes in quick succession would otherwise test a mismatched Makefile.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Test remote install (with Homebrew)
        run: make docker-test-remote
