interface:
  display_name: "Simplify"
  short_description: "Review changed code for cleanups, then apply them"
policy:
  # Codex's half of the SKILL.md `disable-model-invocation: true`. Keep both in
  # sync: without this, Codex still fires the skill implicitly. `$simplify`
  # keeps working either way.
  allow_implicit_invocation: false
